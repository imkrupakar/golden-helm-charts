{{- if .Values.secretstoreGuard.enabled }}
{{- $sa := .Values.secretstoreGuard.serviceAccountName }}
# Guardrail for TEAM-AUTHORED ESO SecretStores (teams write them in <team>-gitops/config/envs/...).
# Enforces: provider azurekv|aws only; auth via the team's dedicated eso-reader ServiceAccount (never
# `default`, never omitted); no static credentials (azurekv WorkloadIdentity, aws jwt/IRSA).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Values.secretstoreGuard.name }}
spec:
  failurePolicy: {{ .Values.secretstoreGuard.failurePolicy }}
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secretstores"]
    namespaceSelector:
      matchExpressions:
        - key: tenant
          operator: Exists
  variables:
    - name: p
      expression: "object.spec.provider"
  validations:
    - expression: "has(variables.p.azurekv) || has(variables.p.aws)"
      message: "tenant SecretStores may only use the azurekv or aws provider"
    - expression: >-
        !has(variables.p.azurekv) || (
          has(variables.p.azurekv.authType) && variables.p.azurekv.authType == 'WorkloadIdentity' &&
          !has(variables.p.azurekv.authSecretRef) &&
          has(variables.p.azurekv.serviceAccountRef) &&
          variables.p.azurekv.serviceAccountRef.name == '{{ $sa }}' &&
          !has(variables.p.azurekv.serviceAccountRef.namespace))
      message: "azurekv SecretStores must use authType WorkloadIdentity with serviceAccountRef.name {{ $sa }} (no authSecretRef)"
    - expression: >-
        !has(variables.p.aws) || (
          has(variables.p.aws.auth) && has(variables.p.aws.auth.jwt) &&
          !has(variables.p.aws.auth.secretRef) &&
          has(variables.p.aws.auth.jwt.serviceAccountRef) &&
          variables.p.aws.auth.jwt.serviceAccountRef.name == '{{ $sa }}' &&
          !has(variables.p.aws.auth.jwt.serviceAccountRef.namespace))
      message: "aws SecretStores must use auth.jwt (IRSA) with serviceAccountRef.name {{ $sa }} (no secretRef)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Values.secretstoreGuard.name }}
spec:
  policyName: {{ .Values.secretstoreGuard.name }}
  validationActions: {{ .Values.secretstoreGuard.validationActions | toJson }}
{{- end }}
