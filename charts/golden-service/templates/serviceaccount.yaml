{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "golden-service.name" . }}
  labels:
    {{- include "golden-service.labels" . | nindent 4 }}
    {{- with (include "golden-service.identityLabels" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
