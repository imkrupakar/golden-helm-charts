{{- if .Values.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "golden-service.name" . }}-secrets
  labels:
    {{- include "golden-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef }}
    kind: SecretStore
  target:
    name: {{ include "golden-service.name" . }}-secrets
    creationPolicy: Owner
  {{- if .Values.externalSecret.data }}
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
  {{- else }}
  data: [] # no keys configured; valid empty array (CRD requires data to be a list)
  {{- end }}
{{- end }}
