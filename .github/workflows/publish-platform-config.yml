# Publishes platform-config as an OCI chart on a `platform-config-vX.Y.Z` tag. Clusters pin this version
# per cluster (envs/<env>/<cloud>/<region>/versions.yaml: platformConfig), so a published version must
# never change: the job refuses to overwrite an existing one and runs the same checks as the PR workflow.
name: publish-platform-config
on:
  push:
    tags:
      - "platform-config-v*"
permissions:
  contents: read
  packages: write
env:
  CHART_REGISTRY: oci://ghcr.io/imkrupakar/charts
  KUBECONFORM: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Resolve and verify version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#platform-config-v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag not SemVer: $VERSION"; exit 1; }
          CHART_VERSION="$(yq '.version' charts/platform-config/Chart.yaml)"
          [ "$VERSION" = "$CHART_VERSION" ] || { echo "tag $VERSION != Chart.yaml $CHART_VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: helm lint --strict charts/platform-config

      - name: Namespace contract (every namespaced resource sets metadata.namespace)
        run: tests/check_namespaces.sh charts/platform-config

      - name: Validate rendered manifests (kubeconform)
        run: |
          # Gateway is a CRD (served from the CRDs-catalog); ValidatingAdmissionPolicy is a built-in
          # that older bundled schemas may lack, so missing schemas are ignored (lint already passed).
          helm template platform-config charts/platform-config \
          | docker run --rm -i "$KUBECONFORM" -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Refuse to overwrite a published version (immutability)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if helm pull "${CHART_REGISTRY}/platform-config" --version "$VERSION" --destination "$RUNNER_TEMP/existing" >/dev/null 2>&1; then
            echo "::error::platform-config $VERSION is already published. Published versions are immutable (clusters pin them); bump the version instead."
            exit 1
          fi

      - name: Package and push to OCI
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          helm package charts/platform-config --version "$VERSION"
          helm push "platform-config-${VERSION}.tgz" "$CHART_REGISTRY"
